    <!-- theme switch logic -->
    <script>
        // The theme is the visitor's own choice if they've made one with the
        // toggle, otherwise whatever the system is set to. Only the toggle
        // saves anything: following the system is never written down, so it
        // can't go stale.
        //
        // It used to save every switch, system ones included, and iOS broke
        // that: when a home-screen app goes to the background, iOS renders it
        // in both light and dark for the app switcher, which the page sees as
        // prefers-color-scheme flipping. The flip was followed and saved, and
        // the next launch opened in whichever scheme the snapshot left behind.
        // So system changes are now ignored while the page is hidden, and the
        // theme is re-read from the system each time the page comes back.
        //
        // "theme" was the old key; its values can't be trusted (see above),
        // so it's dropped in favour of "theme-choice".
        var THEME_KEY = "theme-choice";
        var darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
        try { localStorage.removeItem("theme"); } catch (e) {}

        function savedTheme() {
            try {
                var t = localStorage.getItem(THEME_KEY);
                return t === "dark" || t === "light" ? t : null;
            } catch (e) { return null; }
        }
        function systemTheme() { return darkQuery.matches ? "dark" : "light"; }
        function wantedTheme() { return savedTheme() || systemTheme(); }

        setTheme(wantedTheme());

        // Printing lays the page out in the light scheme, which browsers
        // report as a prefers-color-scheme change. Followed, it switched the
        // page on screen to light, and nothing switched it back when the
        // dialog closed. So while printing, the system setting is ignored,
        // and afterwards the theme from before is put back. (Print
        // stylesheets set their own palette.)
        var themeBeforePrint = null;
        window.addEventListener("beforeprint", function () {
            themeBeforePrint = document.documentElement.getAttribute("data-theme");
        });
        window.addEventListener("afterprint", function () {
            if (themeBeforePrint) setTheme(themeBeforePrint);
            themeBeforePrint = null;
        });

        darkQuery.addEventListener("change", function () {
            if (themeBeforePrint || window.matchMedia("print").matches) return;
            if (document.visibilityState === "hidden") return;
            if (savedTheme()) return;
            fadeTo(systemTheme());
        });

        // Coming back to the page (app switcher, another tab, back/forward
        // cache): catch up with the system, or put the saved choice back,
        // without a fade.
        document.addEventListener("visibilitychange", function () {
            if (document.visibilityState === "visible") setTheme(wantedTheme());
        });
        window.addEventListener("pageshow", function () { setTheme(wantedTheme()); });

        function setTheme(theme) {
            document.documentElement.setAttribute("data-theme", theme);
            // Keep the browser/PWA chrome (status bar, address bar) matching the
            // theme's background — dark #12110f / light #f2ede3 (= --bg).
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", theme === "dark" ? "#12110f" : "#f2ede3");
        }

        // Switch with a short cross-fade rather than a hard cut. A view
        // transition fades the whole page (charts and photos included) where
        // supported; elsewhere a class briefly turns on colour transitions.
        // Reduced motion gets the instant switch. Durations: global.css.
        function fadeTo(theme) {
            var root = document.documentElement;
            if (root.getAttribute("data-theme") === theme) return;
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return setTheme(theme);
            if (document.startViewTransition) {
                document.startViewTransition(function () { setTheme(theme); });
                return;
            }
            root.classList.add("theme-fading");
            setTheme(theme);
            setTimeout(function () { root.classList.remove("theme-fading"); }, 350);
        }

        // The toggle saves the choice, unless it lands back on the system's
        // scheme: then nothing is saved and the page follows the system again.
        function toggleTheme() {
            var next = document.documentElement.getAttribute("data-theme") == "dark" ? "light" : "dark";
            try {
                if (next === systemTheme()) localStorage.removeItem(THEME_KEY);
                else localStorage.setItem(THEME_KEY, next);
            } catch (e) {}
            fadeTo(next);
        }
        window.toggleTheme = toggleTheme;
    </script>

    <script>
        // Skip the service worker on localhost — a SW intercepting vite dev
        // paths (HMR, /src/, /@vite/) can serve a stale response after any
        // dev hiccup and produce a blank-page state that's painful to debug.
        // Existing localhost SW registrations are unregistered defensively.
        if ('serviceWorker' in navigator) {
            const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
            if (isLocal) {
                navigator.serviceWorker.getRegistrations().then((regs) => {
                    regs.forEach((r) => r.unregister());
                });
            } else {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js').catch(() => {});
                });
            }
        }
    </script>
