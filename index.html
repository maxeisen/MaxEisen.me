    <!-- theme switch logic -->
    <script>
        var theme;
        if (localStorage.getItem("theme")) {
            theme = localStorage.getItem("theme");
        }
        else
            theme = (window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        setTheme(theme)

        // Printing lays the page out in the light scheme, which browsers
        // report as a prefers-color-scheme change. Followed, it switched the
        // page on screen to light and saved that as the theme, and nothing
        // switched it back when the dialog closed. So while printing, the
        // system setting is ignored, and afterwards the theme from before
        // is put back. (Print stylesheets set their own palette.)
        var themeBeforePrint = null;
        window.addEventListener("beforeprint", function () {
            themeBeforePrint = document.documentElement.getAttribute("data-theme");
        });
        window.addEventListener("afterprint", function () {
            if (themeBeforePrint) setTheme(themeBeforePrint);
            themeBeforePrint = null;
        });

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (themeBeforePrint || window.matchMedia("print").matches) return;
            fadeTo(event.matches ? "dark" : "light");
        })

        function setTheme(theme) {
            localStorage.setItem("theme", theme);
            document.documentElement.setAttribute("data-theme", theme);
            // Keep the browser/PWA chrome (status bar, address bar) matching the
            // theme's background — dark #12110f / light #f2ede3 (= --bg).
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", theme === "dark" ? "#12110f" : "#f2ede3");
        }

        // Switch with a short cross-fade rather than a hard cut. A view
        // transition fades the whole page (charts and photos included) where
        // supported; elsewhere a class briefly turns on colour transitions.
        // Reduced motion gets the instant switch. Durations: global.css.
        function fadeTo(theme) {
            var root = document.documentElement;
            if (root.getAttribute("data-theme") === theme) return;
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return setTheme(theme);
            if (document.startViewTransition) {
                document.startViewTransition(function () { setTheme(theme); });
                return;
            }
            root.classList.add("theme-fading");
            setTheme(theme);
            setTimeout(function () { root.classList.remove("theme-fading"); }, 350);
        }

        function toggleTheme() {
            fadeTo(document.documentElement.getAttribute("data-theme") == "dark" ? "light" : "dark");
        }
        window.toggleTheme = toggleTheme;
    </script>

    <script>
        // Skip the service worker on localhost — a SW intercepting vite dev
        // paths (HMR, /src/, /@vite/) can serve a stale response after any
        // dev hiccup and produce a blank-page state that's painful to debug.
        // Existing localhost SW registrations are unregistered defensively.
        if ('serviceWorker' in navigator) {
            const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
            if (isLocal) {
                navigator.serviceWorker.getRegistrations().then((regs) => {
                    regs.forEach((r) => r.unregister());
                });
            } else {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js').catch(() => {});
                });
            }
        }
    </script>
